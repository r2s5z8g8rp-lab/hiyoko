<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>釣り日和</title>
  <meta name="description" content="釣行日の潮汐・月齢・日の出入り・天気・波・水温・おすすめ魚種と釣り場をまとめて確認できる釣りプランナー">
  <meta name="theme-color" content="#0d4f7a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1><span aria-hidden="true">🎣</span> 釣り日和</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="plan" aria-selected="true">釣行プラン</button>
      <button role="tab" data-tab="spots">釣り場</button>
      <button role="tab" data-tab="fish">魚種図鑑</button>
    </nav>
  </header>

  <main>
    <!-- 釣行プラン -->
    <section id="tab-plan" class="tab-panel">
      <form id="plan-form" class="card plan-form">
        <label class="field">
          <span>釣り場</span>
          <select id="plan-spot"></select>
        </label>
        <label class="field">
          <span>釣行日</span>
          <input type="date" id="plan-date" required>
        </label>
        <div class="quick-dates" id="quick-dates"></div>
        <button type="submit" class="btn primary">この日を調べる</button>
        <p class="hint" id="plan-hint"></p>
      </form>
      <div id="report" aria-live="polite"></div>
    </section>

    <!-- 釣り場 -->
    <section id="tab-spots" class="tab-panel" hidden>
      <div class="card">
        <form id="search-form" class="search-row">
          <input type="search" id="search-q" placeholder="地名で検索（例：城ヶ島、大黒ふ頭）" aria-label="地名で検索">
          <button class="btn" type="submit">検索</button>
          <button class="btn" type="button" id="btn-here" title="現在地">📍 現在地</button>
        </form>
        <ul id="search-results" class="search-results"></ul>
        <div id="map" class="map" role="region" aria-label="地図"></div>
        <p class="hint">地図をタップすると、その場所を釣り場として登録できます。</p>
      </div>
      <div class="list-head">
        <h2>登録した釣り場</h2>
        <div class="list-tools">
          <button class="btn small" id="btn-export">書き出し</button>
          <label class="btn small">読み込み<input type="file" id="file-import" accept="application/json" hidden></label>
        </div>
      </div>
      <ul id="spot-list" class="spot-list"></ul>
    </section>

    <!-- 魚種図鑑 -->
    <section id="tab-fish" class="tab-panel" hidden>
      <div class="card filter-row">
        <label class="field inline"><span>月</span><select id="fish-month"></select></label>
        <label class="field inline"><span>釣り場</span><select id="fish-spot"></select></label>
      </div>
      <div id="fish-list" class="fish-grid"></div>
    </section>
  </main>

  <dialog id="spot-dialog">
    <form id="spot-form" method="dialog" class="spot-form">
      <h2 id="spot-dialog-title">釣り場を登録</h2>
      <input type="hidden" name="id">
      <label class="field"><span>名前</span><input name="name" required maxlength="40" placeholder="例：〇〇漁港 赤灯台"></label>
      <label class="field"><span>種類</span><select name="type"></select></label>
      <div class="two">
        <label class="field"><span>緯度</span><input name="lat" type="number" step="any" required></label>
        <label class="field"><span>経度</span><input name="lon" type="number" step="any" required></label>
      </div>
      <label class="field"><span>狙いたい魚・ポイントメモ</span><textarea name="memo" rows="3" placeholder="例：先端の外向きでアジ。常夜灯あり。駐車場は24h"></textarea></label>
      <details>
        <summary>詳細設定</summary>
        <label class="field"><span>高潮間隔（時間）<small>潮位予報がない日の潮時の概算に使用。近くの港の潮見表と比べて調整できます。</small></span>
          <input name="interval" type="number" step="0.1" min="0" max="12" value="5"></label>
      </details>
      <div class="dialog-actions">
        <button class="btn" value="cancel" formnovalidate>キャンセル</button>
        <button class="btn primary" value="save" id="spot-save">保存</button>
      </div>
    </form>
  </dialog>

  <footer class="app-footer">
    <p>天気・波・水温・潮位：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（CC BY 4.0） ／ 地図：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>
    <p>潮位は数値モデルの予測値です。湾奥・港内などでは実際と差が出ることがあります。安全のため、出発前に気象庁の警報・注意報と現地の状況を必ず確認してください。</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
